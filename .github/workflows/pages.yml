name: Interactive demo (GitHub Pages)

# Publishes demo/ to GitHub Pages. It's a self-contained interactive HTML page:
# unlock, upload (drag-drop, real thumbnails via Canvas), folders, Trash,
# details panel, search, list/grid — all working client-side, no server needed.
#
# GitHub Pages can only serve static files, so this is what a browser gets
# there. To run the actual Next.js app with SQLite and uploads, see the
# "Try it live" section in the README (one-click Deploy to Render).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the demo site
        run: |
          mkdir -p _site
          cp -r demo/. _site/
          # Bring in the same brand assets the app uses, so the wordmark/icon match.
          if [ -d public/brand ]; then mkdir -p _site/brand && cp -r public/brand/. _site/brand/; fi
          # Disable Jekyll so filenames beginning with "_" are served verbatim.
          : > _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
